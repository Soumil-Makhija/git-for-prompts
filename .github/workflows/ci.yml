name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q promptgit scripts
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m pip install --no-deps dist/*.whl
        shell: bash
      - name: Installed CLI and fixture evaluation outside source directory
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          promptgit --help
          python "$GITHUB_WORKSPACE/scripts/demo.py" "$RUNNER_TEMP/promptgit-evidence"
      - name: Prepare action test IDs
        id: ids
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ids = json.loads((Path(os.environ['RUNNER_TEMP'])/'promptgit-evidence/ids.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('base=' + ids['base'] + '\n')
          PY
      - uses: ./
        with:
          store: ${{ runner.temp }}/promptgit-evidence/store
          base: ${{ steps.ids.outputs.base }}
          candidate: ${{ steps.ids.outputs.base }}
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/promptgit-evidence/*.json
